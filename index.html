<script>
(function(){
  const panel=document.getElementById('errorPanel');
  const output=document.getElementById('errorText');
  const seen=new Set();
  function showError(title,details){
    const message=(title+'\\n'+(details||'No additional details')).trim();
    if(seen.has(message))return;
    seen.add(message);
    output.textContent+=(output.textContent?'\\n\\n':'')+message;
    panel.hidden=false;
  }
  window.addEventListener('error',function(event){
    if(event.message){
      const where=event.filename?event.filename+(event.lineno?':'+event.lineno+':'+(event.colno||0):''):'';
      showError(event.message,where+(event.error&&event.error.stack?'\\n'+event.error.stack:''));
    }else if(event.target&&event.target!==window){
      const target=event.target;
      if(target.tagName==='SCRIPT'||target.tagName==='LINK')showError('Resource failed to load',target.src||target.href||target.tagName);
    }
  },true);
  window.addEventListener('unhandledrejection',function(event){
    const reason=event.reason;
    showError('Unhandled promise rejection',reason&&reason.stack?reason.stack:String(reason));
  });
  document.addEventListener('click',function(event){
    if(event.target&&event.target.id==='clearErrors'){output.textContent='';seen.clear();panel.hidden=true;}
  });
})();
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { DDSLoader } from 'three/addons/loaders/DDSLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const host=document.getElementById('view'), status=document.getElementById('status');
const brightnessInput=document.getElementById('brightness');
const brightnessValue=document.getElementById('brightnessValue');
const reflectionStrengthInput=document.getElementById('reflectionStrength');
const metalnessInput=document.getElementById('metalness');
const roughnessInput=document.getElementById('roughness');
const clearcoatInput=document.getElementById('clearcoat');
const lightingSelect=document.getElementById('lighting');
const textureViewSelect=document.getElementById('textureView');
const modelInfo=document.getElementById('modelInfo');
const presetSelect=document.getElementById('presetSelect');
const presetNameInput=document.getElementById('presetName');
const textureToggle=document.getElementById('textures');
const wireframeToggle=document.getElementById('wireframe');
const wireColorInput=document.getElementById('wireColor');
const wireThicknessInput=document.getElementById('wireThickness');
const wireGlowInput=document.getElementById('wireGlow');
const gridToggle=document.getElementById('showGrid');
const rotateToggle=document.getElementById('autoRotate');
const backgroundSelect=document.getElementById('background');
const weaponSelect=document.getElementById('weaponSelect');
const activeWeapon=new URLSearchParams(location.search).get('weapon')==='m4'?'m4':'deagle';
weaponSelect.value=activeWeapon;
document.getElementById('pageTitle').textContent=activeWeapon==='m4'?'ARCWAVE · M4':'ARCWAVE · DESERT EAGLE';
weaponSelect.addEventListener('change',()=>{const url=new URL(location.href);if(weaponSelect.value==='m4')url.searchParams.set('weapon','m4');else url.searchParams.delete('weapon');location.href=url.toString();});
let modelRoot=null, modelMaterials=[], defaultCameraPosition=null, scrollShaders=[], wireframeOverlays=[], loadedTextures={color:null};
const pulseEnabledInput=document.getElementById('pulseEnabled');
const pulseStrengthInput=document.getElementById('pulseStrength');
const scrollEnabledInput=document.getElementById('scrollEnabled');
const scrollSpeedInput=document.getElementById('scrollSpeed');
const scrollScaleInput=document.getElementById('scrollScale');
const scrollVisibilityInput=document.getElementById('scrollVisibility');
const scrollDirectionInput=document.getElementById('scrollDirection');
const scrollReverseInput=document.getElementById('scrollReverse');
const scrollPausedInput=document.getElementById('scrollPaused');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x07111f);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,1000);
camera.position.set(4,3,6);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.debug.onShaderError=(gl,program,vertexShader,fragmentShader)=>{const details=[gl.getProgramInfoLog(program),gl.getShaderInfoLog(vertexShader),gl.getShaderInfoLog(fragmentShader)].filter(Boolean).join('\\n');window.dispatchEvent(new CustomEvent('arcwave-shader-error',{detail:details||'WebGL shader compilation failed'}));};
window.addEventListener('arcwave-shader-error',event=>{const panel=document.getElementById('errorPanel'),output=document.getElementById('errorText');output.textContent+=(output.textContent?'\\n\\n':'')+'WebGL shader error\\n'+event.detail;panel.hidden=false;});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping;
const pmremGenerator=new THREE.PMREMGenerator(renderer);
scene.environment=pmremGenerator.fromScene(new RoomEnvironment(),0.04).texture;
renderer.toneMappingExposure=1.15; host.appendChild(renderer.domElement);
const hemi=new THREE.HemisphereLight(0x9bcaff,0x182235,2);scene.add(hemi);
const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(4,7,5);scene.add(key);
const rim=new THREE.DirectionalLight(0x168cff,2.5);rim.position.set(-5,2,-4);scene.add(rim);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0x0b1728,metalness:.25,roughness:.7}));
floor.rotation.x=-Math.PI/2;floor.position.y=-1.2;scene.add(floor);
const grid=new THREE.GridHelper(30,30,0x18385a,0x10243b);grid.position.y=-1.19;scene.add(grid);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.06;
controls.target.set(0,0,0);

const dds=new DDSLoader();
const loadTexture=(file)=>new Promise((resolve)=>dds.load('./'+file,resolve,undefined,()=>resolve(null)));
const loader=new FBXLoader();
const modelUrl=activeWeapon==='m4'?'https://raw.githubusercontent.com/Magical298/m4/main/viewmodel_m4.fbx':'./arcwave.fbx';
loader.load(modelUrl,async(model)=>{
  const color=activeWeapon==='m4'?await new THREE.TextureLoader().loadAsync('https://raw.githubusercontent.com/Magical298/m4/main/weapon_m4_col.png').catch(error=>{console.error('M4 colour texture failed to load',error);return null;}):await new THREE.TextureLoader().loadAsync('./weapon_desert_eagle_silver_col.png').catch(error=>{console.error('Deagle colour texture failed to load',error);return null;});
  // The optional Arcwave scroll texture was removed from the repository.
  const scroll=null;
  if(color){color.colorSpace=THREE.SRGBColorSpace;color.flipY=false;}
  if(scroll){scroll.colorSpace=THREE.NoColorSpace;scroll.flipY=false;scroll.wrapS=THREE.RepeatWrapping;scroll.wrapT=THREE.RepeatWrapping;scroll.needsUpdate=true;}
  loadedTextures={color,scroll};
  let vertexCount=0,faceCount=0,meshCount=0;
  const modelBounds=new THREE.Box3().setFromObject(model);
  const modelDimensions=modelBounds.getSize(new THREE.Vector3());
  const maxModelDimension=Math.max(modelDimensions.x,modelDimensions.y,modelDimensions.z)||1;
  // Collect the original weapon meshes first. Do not add overlay children
  // while traversing: Three.js traverse() would visit those new children too.
  const modelMeshes=[];
  model.traverse(obj=>{if(obj.isMesh)modelMeshes.push(obj);});
  for(const obj of modelMeshes){
    meshCount++;
    const geometry=obj.geometry;
    if(geometry.attributes.position)vertexCount+=geometry.attributes.position.count;
    faceCount+=geometry.index?geometry.index.count/3:(geometry.attributes.position?geometry.attributes.position.count/3:0);
    obj.castShadow=true;obj.receiveShadow=true;
    const old=obj.material;
    // FBX meshes can use several material slots. Preserve the full array so
    // each polygon group keeps its own material and UV assignment.
    const sourceMaterials=Array.isArray(old)?old:[old];
    const materials=sourceMaterials.map(source=>source&&source.isMaterial?source.clone():new THREE.MeshPhysicalMaterial());
    for(const mat of materials){
      // Keep the FBX's original material type and surface settings. The external
      // colour texture is applied as its albedo map instead of replacing the
      // whole material with a generic MeshPhysicalMaterial.
      if(color){
        mat.map=color;
        if(mat.color)mat.color.set(0xffffff);
      }
      if('metalness' in mat)mat.metalness=Number(metalnessInput.value);
      if('roughness' in mat)mat.roughness=Number(roughnessInput.value);
      if('envMapIntensity' in mat)mat.envMapIntensity=Number(reflectionStrengthInput.value);
      if('clearcoat' in mat)mat.clearcoat=Number(clearcoatInput.value);
      mat.userData.originalMap=mat.map;
      mat.userData.originalNormal=mat.normalMap||null;
      mat.userData.originalRoughness=mat.roughnessMap||null;
      if(activeWeapon==='deagle')mat.onBeforeCompile=(shader)=>{
        shader.uniforms.arcScrollMap={value:scroll};
        shader.uniforms.arcScrollTime={value:0};
        shader.uniforms.arcScrollSpeed={value:Number(scrollSpeedInput.value)};
        shader.uniforms.arcScrollScale={value:Number(scrollScaleInput.value)};
        shader.uniforms.arcScrollDirection={value:Number(scrollDirectionInput.value)};
        shader.uniforms.arcScrollReverse={value:scrollReverseInput.checked?1:0};
        shader.uniforms.arcScrollEnabled={value:scrollEnabledInput.checked?1:0};
        shader.uniforms.arcScrollVisibility={value:Number(scrollVisibilityInput.value)};
        shader.uniforms.arcPulseEnabled={value:pulseEnabledInput.checked?1:0};
        shader.uniforms.arcPulseStrength={value:Number(pulseStrengthInput.value)};
        shader.vertexShader=shader.vertexShader.replace(
          '#include <common>',
          '#include <common>\nvarying vec3 vArcwaveLocalPosition;\nvarying vec3 vArcwaveLocalNormal;'
        ).replace(
          '#include <begin_vertex>',
          '#include <begin_vertex>\nvArcwaveLocalPosition = position;\nvArcwaveLocalNormal = normal;'
        );
        shader.fragmentShader=shader.fragmentShader.replace(
          '#include <common>',
          '#include <common>\nuniform sampler2D arcScrollMap;\nuniform float arcScrollTime;\nuniform float arcScrollSpeed;\nuniform float arcScrollScale;\nuniform float arcScrollDirection;\nuniform float arcScrollReverse;\nuniform float arcScrollEnabled;\nuniform float arcScrollVisibility;\nuniform float arcPulseEnabled;\nuniform float arcPulseStrength;\nvarying vec3 vArcwaveLocalPosition;\nvarying vec3 vArcwaveLocalNormal;'
        ).replace(
          '#include <map_fragment>',
          `#include <map_fragment>
          float arcEnergyMask = 0.0;
          if (arcScrollEnabled > 0.5) {
            // Original COD4 Arcwave: triplanar projection from object position and surface normal.
            vec3 arcPosition = vArcwaveLocalPosition;
            float arcTravel = arcScrollTime * arcScrollSpeed * 0.8 * mix(1.0, -1.0, arcScrollReverse);
            if (arcScrollDirection < 0.5) {
              arcPosition.z += arcTravel;
            } else if (arcScrollDirection < 1.5) {
              arcPosition.x += arcTravel;
            } else if (arcScrollDirection < 2.5) {
              arcPosition.y += arcTravel;
            } else {
              arcPosition += vec3(arcTravel);
            }
            vec3 tpUVS = arcPosition * (arcScrollScale / 40.0);
            vec3 tpBlend = pow(max(abs(normalize(vArcwaveLocalNormal)) - vec3(0.2), vec3(0.0)), vec3(1.8));
            tpBlend /= max(tpBlend.x + tpBlend.y + tpBlend.z, 0.00001);
            vec4 tpSample = tpBlend.x * texture2D(arcScrollMap, tpUVS.yz);
            tpSample += tpBlend.y * texture2D(arcScrollMap, tpUVS.xz);
            tpSample += tpBlend.z * texture2D(arcScrollMap, tpUVS.xy);
            // COD4 uses the base colour texture alpha to blend energy texture and lit weapon colour.
            float arcEnergyBlend = (1.0 - diffuseColor.a) * arcScrollVisibility;
            diffuseColor.rgb = mix(diffuseColor.rgb, tpSample.rgb, arcEnergyBlend);
            arcEnergyMask = max(max(tpSample.r, tpSample.g), tpSample.b) * arcEnergyBlend;
          }`
        ).replace(
          '#include <emissivemap_fragment>',
          `#include <emissivemap_fragment>
          if (arcScrollEnabled > 0.5) {
            totalEmissiveRadiance += vec3(0.0, 0.3, 1.0) * arcEnergyMask * arcScrollVisibility * 3.0;
          }
          // Same animated cyan/violet plasma used on the M4, integrated into
          // the Deagle's existing material to avoid a second-mesh depth conflict.
          if (arcScrollEnabled > 0.5) {
          float deaglePhase=arcScrollTime*0.8;
          vec3 deagleN=normalize(vArcwaveLocalNormal);
          vec3 deagleBlend=pow(max(abs(deagleN)-vec3(0.25),vec3(0.0)),vec3(1.5));
          deagleBlend/=max(deagleBlend.x+deagleBlend.y+deagleBlend.z,0.0001);
          vec3 deaglePos=vArcwaveLocalPosition*32.0;
          vec2 deagleUVX=deaglePos.yz;
          vec2 deagleUVY=deaglePos.xz;
          vec2 deagleUVZ=deaglePos.xy;
          float deagleFlowX=deagleUVX.x*0.22+deagleUVX.y*0.11-deaglePhase;
          float deagleFlowY=deagleUVY.x*0.22+deagleUVY.y*0.11-deaglePhase;
          float deagleFlowZ=deagleUVZ.x*0.22+deagleUVZ.y*0.11-deaglePhase;
          float deagleVeinX=pow(clamp(1.0-abs(sin(deagleFlowX*6.0+sin(deagleUVX.y*0.55+sin(deagleUVX.x*0.31-deaglePhase*0.7)*1.8+deaglePhase*1.6)*2.0)),0.0,1.0),10.0);
          float deagleVeinY=pow(clamp(1.0-abs(sin(deagleFlowY*6.0+sin(deagleUVY.y*0.55+sin(deagleUVY.x*0.31-deaglePhase*0.7)*1.8+deaglePhase*1.6)*2.0)),0.0,1.0),10.0);
          float deagleVeinZ=pow(clamp(1.0-abs(sin(deagleFlowZ*6.0+sin(deagleUVZ.y*0.55+sin(deagleUVZ.x*0.31-deaglePhase*0.7)*1.8+deaglePhase*1.6)*2.0)),0.0,1.0),10.0);
          float deagleGlow=deagleVeinX*deagleBlend.x+deagleVeinY*deagleBlend.y+deagleVeinZ*deagleBlend.z;
          float deagleHue=0.5+0.5*sin((deagleFlowX*deagleBlend.x+deagleFlowY*deagleBlend.y+deagleFlowZ*deagleBlend.z)*1.5-deaglePhase*0.8);
          vec3 deagleEnergy=mix(vec3(0.02,0.65,1.0),vec3(0.42,0.05,1.0),deagleHue);
          totalEmissiveRadiance+=deagleEnergy*(0.18+deagleGlow*1.4)*1.6;
          }`
        );
        status.textContent=activeWeapon==='m4'?'M4 loaded · Arcwave plasma shader active':'Model loaded · Arcwave procedural shader active';
        scrollShaders.push(shader);
      };
      if(activeWeapon==='deagle')mat.customProgramCacheKey=()=> 'deagle-m4-style-integrated-plasma-v1';
      if(activeWeapon==='m4'){
        // Integrated into the base material to avoid duplicate-surface depth flicker.
        mat.onBeforeCompile=(shader)=>{
          shader.uniforms.m4ArcwaveTime={value:0};
          shader.uniforms.m4ArcwaveEnabled={value:scrollEnabledInput.checked?1:0};
          shader.vertexShader=shader.vertexShader.replace(
            '#include <common>',
            `#include <common>
  varying vec3 vM4ArcPosition;
  varying vec3 vM4ArcNormal;`
          ).replace(
            '#include <begin_vertex>',
            `#include <begin_vertex>
  vM4ArcPosition=position;
  vM4ArcNormal=normal;`
          );
          shader.fragmentShader=shader.fragmentShader.replace(
            '#include <common>',
            `#include <common>
  uniform float m4ArcwaveTime;
  uniform float m4ArcwaveEnabled;
  varying vec3 vM4ArcPosition;
  varying vec3 vM4ArcNormal;
  float m4ArcSat(float x){return clamp(x,0.0,1.0);}
  vec3 m4ElectricPlasma(vec2 uv,float time){
    float flow=uv.x*0.22+uv.y*0.11-time;
    float turbulence=sin(uv.y*0.55+sin(uv.x*0.31-time*0.7)*1.8+time*1.6);
    float wave=sin(flow*6.0+turbulence*2.0);
    float veins=pow(m4ArcSat(1.0-abs(wave)),10.0);
    float wisps=0.5+0.5*sin(uv.x*0.9-uv.y*0.45-time*2.2+sin(uv.y*0.7+time)*1.5);
    float glow=m4ArcSat(veins*1.2+pow(wisps,5.0)*0.35);
    float hue=0.5+0.5*sin(flow*1.5-time*0.8);
    vec3 energy=mix(vec3(0.02,0.65,1.0),vec3(0.42,0.05,1.0),hue);
    return energy*(0.18+glow*1.4);
  }`
          ).replace(
            '#include <emissivemap_fragment>',
            `#include <emissivemap_fragment>
  if (m4ArcwaveEnabled > 0.5) {
  float m4Phase=m4ArcwaveTime*0.8;
  vec3 m4N=normalize(vM4ArcNormal);
  vec3 m4Blend=pow(max(abs(m4N)-vec3(0.25),vec3(0.0)),vec3(1.5));
  m4Blend/=max(m4Blend.x+m4Blend.y+m4Blend.z,0.0001);
  vec3 m4Plasma=m4ElectricPlasma(vM4ArcPosition.yz*32.0,m4Phase)*m4Blend.x
    +m4ElectricPlasma(vM4ArcPosition.xz*32.0,m4Phase)*m4Blend.y
    +m4ElectricPlasma(vM4ArcPosition.xy*32.0,m4Phase)*m4Blend.z;
  totalEmissiveRadiance+=m4Plasma*1.6;
  }`
          );
          scrollShaders.push(shader);
        };
        mat.customProgramCacheKey=()=> 'm4-arcwave-integrated-v3';
      }

    }
    obj.material=Array.isArray(old)?materials:materials[0];
    // Dedicated triangle-wireframe overlay. WireframeGeometry + LineSegments is
    // more reliable across browsers than barycentric derivatives on a cloned mesh.
    const wireGeometry=new THREE.WireframeGeometry(geometry);
    const wireMaterial=new THREE.ShaderMaterial({
      uniforms:{
        uColor:{value:new THREE.Color(wireColorInput.value)},
        uThickness:{value:Number(wireThicknessInput.value)},
        uGlow:{value:Number(wireGlowInput.value)},
        uTime:{value:0}
      },
      vertexShader:`void main(){
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
      }`,
      fragmentShader:`uniform vec3 uColor;
        uniform float uThickness;
        uniform float uGlow;
        uniform float uTime;
        void main(){
          float intensity=1.0+uGlow;
          float lineAlpha=clamp(0.72+uThickness*0.08,0.0,1.0);
          gl_FragColor=vec4(uColor*intensity,lineAlpha);
        }`,
      transparent:true,
      depthWrite:false,
      depthTest:false,
      blending:THREE.AdditiveBlending,
      toneMapped:false
    });
    const wireOverlay=new THREE.LineSegments(wireGeometry,wireMaterial);
    wireOverlay.name='Arcwave wireframe shader overlay';
    wireOverlay.visible=wireframeToggle.checked;
    wireOverlay.renderOrder=10;
    wireOverlay.frustumCulled=false;
    obj.add(wireOverlay);
    wireframeOverlays.push(wireOverlay);
  }
  const box=new THREE.Box3().setFromObject(model), size=box.getSize(new THREE.Vector3()), center=box.getCenter(new THREE.Vector3());
  model.position.sub(center);scene.add(model);modelRoot=model;
  const maxDim=Math.max(size.x,size.y,size.z)||1;
  camera.position.set(maxDim*1.5,maxDim*.9,maxDim*1.8);camera.near=maxDim/100;camera.far=maxDim*100;camera.updateProjectionMatrix();
  defaultCameraPosition=camera.position.clone();
  controls.target.set(0,0,0);controls.update();
  modelInfo.innerHTML='Meshes: '+meshCount+'<br>Vertices: '+vertexCount.toLocaleString()+'<br>Triangles: '+Math.floor(faceCount).toLocaleString()+'<br>Size: '+size.x.toFixed(3)+' × '+size.y.toFixed(3)+' × '+size.z.toFixed(3)+' units';
  status.textContent=activeWeapon==='m4'?'M4 loaded · Arcwave plasma active':'Model loaded · colour '+(color?'loaded':'missing')+' · scroll texture not configured';
},undefined,error=>{console.error(error);status.textContent='Could not load '+(activeWeapon==='m4'?'M4 model from Magical298/m4':'arcwave.fbx')+' — check the file and GitHub Pages deployment.';});
function applyBrightness(){
  const value=Number(brightnessInput.value);
  brightnessValue.textContent=value.toFixed(1)+'×';
  renderer.toneMappingExposure=1.15*value;
  hemi.intensity=2*value;key.intensity=3*value;rim.intensity=2.5*value;
}
brightnessInput.addEventListener('input',applyBrightness);
reflectionStrengthInput.addEventListener('input',()=>{for(const mat of modelMaterials)mat.envMapIntensity=Number(reflectionStrengthInput.value);});
metalnessInput.addEventListener('input',()=>{for(const mat of modelMaterials)mat.metalness=Number(metalnessInput.value);});
roughnessInput.addEventListener('input',()=>{for(const mat of modelMaterials)mat.roughness=Number(roughnessInput.value);});
clearcoatInput.addEventListener('input',()=>{for(const mat of modelMaterials)mat.clearcoat=Number(clearcoatInput.value);});
function updateScrollSettings(){for(const shader of scrollShaders){if(!shader.uniforms)continue;const enabled=scrollEnabledInput.checked?1:0;if(shader.uniforms.arcScrollEnabled)shader.uniforms.arcScrollEnabled.value=enabled;if(shader.uniforms.m4ArcwaveEnabled)shader.uniforms.m4ArcwaveEnabled.value=enabled;if(shader.uniforms.arcScrollSpeed)shader.uniforms.arcScrollSpeed.value=Number(scrollSpeedInput.value);if(shader.uniforms.arcScrollScale)shader.uniforms.arcScrollScale.value=Number(scrollScaleInput.value);if(shader.uniforms.arcScrollDirection)shader.uniforms.arcScrollDirection.value=Number(scrollDirectionInput.value);if(shader.uniforms.arcScrollReverse)shader.uniforms.arcScrollReverse.value=scrollReverseInput.checked?1:0;if(shader.uniforms.arcScrollVisibility)shader.uniforms.arcScrollVisibility.value=Number(scrollVisibilityInput.value);if(shader.uniforms.arcPulseEnabled)shader.uniforms.arcPulseEnabled.value=pulseEnabledInput.checked?1:0;if(shader.uniforms.arcPulseStrength)shader.uniforms.arcPulseStrength.value=Number(pulseStrengthInput.value);}}
scrollEnabledInput.addEventListener('change',updateScrollSettings);
scrollSpeedInput.addEventListener('input',updateScrollSettings);
scrollScaleInput.addEventListener('input',updateScrollSettings);
scrollVisibilityInput.addEventListener('input',updateScrollSettings);
scrollDirectionInput.addEventListener('change',updateScrollSettings);
scrollReverseInput.addEventListener('change',updateScrollSettings);
pulseEnabledInput.addEventListener('change',updateScrollSettings);
pulseStrengthInput.addEventListener('input',updateScrollSettings);
document.getElementById('resetShaderSettings').addEventListener('click',()=>{
  scrollEnabledInput.checked=true;scrollDirectionInput.value='0';scrollReverseInput.checked=false;scrollPausedInput.checked=false;pulseEnabledInput.checked=true;pulseStrengthInput.value='0.35';
  scrollSpeedInput.value='0.8';scrollVisibilityInput.value='1';scrollScaleInput.value='4';
  scrollElapsed=0;updateScrollSettings();status.textContent='Shader settings reset to defaults.';
});

const PRESET_STORAGE_KEY='arcwaveMaterialPresets';
const presetFields=['brightness','reflectionStrength','metalness','roughness','clearcoat','scrollEnabled','scrollDirection','scrollReverse','scrollPaused','scrollSpeed','scrollVisibility','scrollScale','pulseEnabled','pulseStrength','lighting','background'];
function readPresets(){
  try{return JSON.parse(localStorage.getItem(PRESET_STORAGE_KEY)||'{}')||{};}
  catch(error){console.warn('Could not read saved presets',error);return {};}
}
function refreshPresetList(selected=''){
  const presets=readPresets();
  presetSelect.replaceChildren(new Option('Select a preset',''));
  Object.keys(presets).sort((a,b)=>a.localeCompare(b)).forEach(name=>presetSelect.add(new Option(name,name)));
  presetSelect.value=selected;
}
function getCurrentPreset(){
  const values={};
  for(const id of presetFields){
    const el=document.getElementById(id);
    values[id]=el.type==='checkbox'?el.checked:el.value;
  }
  return values;
}
function applyPreset(values){
  for(const id of presetFields){
    if(!(id in values))continue;
    const el=document.getElementById(id);
    if(el.type==='checkbox')el.checked=Boolean(values[id]);
    else el.value=String(values[id]);
    el.dispatchEvent(new Event(el.type==='checkbox'?'change':'input',{bubbles:true}));
  }
  lightingSelect.dispatchEvent(new Event('change',{bubbles:true}));
  backgroundSelect.dispatchEvent(new Event('change',{bubbles:true}));
  applyBrightness();
  updateScrollSettings();
}
document.getElementById('savePreset').addEventListener('click',()=>{
  const name=presetNameInput.value.trim();
  if(!name){status.textContent='Enter a name for this preset first.';presetNameInput.focus();return;}
  const presets=readPresets();
  presets[name]=getCurrentPreset();
  try{localStorage.setItem(PRESET_STORAGE_KEY,JSON.stringify(presets));refreshPresetList(name);status.textContent='Preset saved: '+name;}
  catch(error){status.textContent='Could not save preset. Check your browser storage settings.';console.error(error);}
});
document.getElementById('loadPreset').addEventListener('click',()=>{
  const name=presetSelect.value,preset=readPresets()[name];
  if(!name||!preset){status.textContent='Choose a saved preset to load.';return;}
  applyPreset(preset);presetNameInput.value=name;status.textContent='Preset loaded: '+name;
});
document.getElementById('deletePreset').addEventListener('click',()=>{
  const name=presetSelect.value;
  if(!name){status.textContent='Choose a saved preset to delete.';return;}
  const presets=readPresets();delete presets[name];
  try{localStorage.setItem(PRESET_STORAGE_KEY,JSON.stringify(presets));refreshPresetList();presetNameInput.value='';status.textContent='Preset deleted: '+name;}
  catch(error){status.textContent='Could not update saved presets.';console.error(error);}
});
refreshPresetList();

document.getElementById('resetDefaults').addEventListener('click',()=>{
  const defaults={
    brightness:'1.2',reflectionStrength:'1.2',metalness:'0.85',roughness:'0.32',clearcoat:'0.35',
    scrollEnabled:true,scrollDirection:'0',scrollReverse:false,scrollPaused:false,scrollSpeed:'0.8',scrollVisibility:'1',scrollScale:'4',pulseEnabled:true,pulseStrength:'0.35',
    lighting:'studio',background:'07111f'
  };
  applyPreset(defaults);
  textureToggle.checked=true;
  textureViewSelect.value='material';
  applyTextureInspection();
  wireframeToggle.checked=false;
  updateWireframeSettings();
  wireThicknessInput.value="1.2";wireGlowInput.value="1.8";wireColorInput.value="#35c8ff";
  gridToggle.checked=true;grid.visible=true;floor.visible=true;
  rotateToggle.checked=false;controls.autoRotate=false;
  status.textContent='Default Arcwave settings restored.';
});

function updateWireframeSettings(){const colour=new THREE.Color(wireColorInput.value);for(const overlay of wireframeOverlays){overlay.visible=wireframeToggle.checked;overlay.material.uniforms.uColor.value.copy(colour);overlay.material.uniforms.uThickness.value=Number(wireThicknessInput.value);overlay.material.uniforms.uGlow.value=Number(wireGlowInput.value);}}
wireframeToggle.addEventListener('change',updateWireframeSettings);
wireColorInput.addEventListener('change',updateWireframeSettings);
wireThicknessInput.addEventListener('input',updateWireframeSettings);
wireGlowInput.addEventListener('input',updateWireframeSettings);
gridToggle.addEventListener('change',()=>{grid.visible=gridToggle.checked;floor.visible=gridToggle.checked;});
rotateToggle.addEventListener('change',()=>{controls.autoRotate=rotateToggle.checked;});
backgroundSelect.addEventListener('change',()=>{const c=new THREE.Color('#'+backgroundSelect.value);scene.background=c;});
function applyTextureInspection(){
  const mode=textureViewSelect.value;
  for(const mat of modelMaterials){
    mat.map=textureToggle.checked?(mode==='material'?mat.userData.originalMap:(loadedTextures[mode]||null)):null;
    mat.normalMap=textureToggle.checked&&mode==='material'?mat.userData.originalNormal:null;
    mat.roughnessMap=textureToggle.checked&&mode==='material'?mat.userData.originalRoughness:null;
    mat.needsUpdate=true;
  }
}
textureViewSelect.addEventListener('change',()=>{textureToggle.checked=true;applyTextureInspection();});
textureToggle.addEventListener('change',()=>{
  if(!textureToggle.checked)textureViewSelect.value='material';
  applyTextureInspection();
  updateScrollSettings();
});
lightingSelect.addEventListener('change',()=>{
  const presets={studio:[2,3,2.5,1.15],bright:[3.2,4.5,1.4,1.35],soft:[2.8,1.8,.7,1.05],dramatic:[.8,4.2,3.8,1.1]};
  const p=presets[lightingSelect.value],b=Number(brightnessInput.value);
  hemi.intensity=p[0]*b;key.intensity=p[1]*b;rim.intensity=p[2]*b;renderer.toneMappingExposure=p[3]*b;
});
document.getElementById('zoomIn').addEventListener('click',()=>camera.position.multiplyScalar(.8));
document.getElementById('zoomOut').addEventListener('click',()=>camera.position.multiplyScalar(1.25));
document.getElementById('screenshot').addEventListener('click',()=>{
  renderer.render(scene,camera);
  const link=document.createElement('a');link.download='arcwave-preview.png';link.href=renderer.domElement.toDataURL('image/png');link.click();
});
document.getElementById('fullscreen').addEventListener('click',()=>{
  if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();
});
document.getElementById('resetView').addEventListener('click',()=>{
  if(defaultCameraPosition)camera.position.copy(defaultCameraPosition);
  controls.target.set(0,0,0);controls.update();
});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const scrollClock=new THREE.Clock();
let scrollElapsed=0;
function animate(){requestAnimationFrame(animate);const delta=scrollClock.getDelta();if(!scrollPausedInput.checked)scrollElapsed+=delta;for(const shader of scrollShaders){if(shader.uniforms?.arcScrollTime)shader.uniforms.arcScrollTime.value=scrollElapsed;}for(const overlay of wireframeOverlays){const timeUniform=overlay.material?.uniforms?.uTime;if(timeUniform)timeUniform.value=scrollElapsed;}controls.update();renderer.render(scene,camera);}animate();
</script>
</body></html>
