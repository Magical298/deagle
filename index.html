<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arcwave Desert Eagle Preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eaf3ff;font:15px system-ui,sans-serif;overflow:hidden}
#view{position:fixed;inset:0}header{position:fixed;z-index:2;top:20px;left:24px;pointer-events:none}
h1{font-size:22px;margin:0 0 5px;letter-spacing:.04em}p{margin:0;color:#9fb4ce;font-size:13px}
#status{position:fixed;z-index:2;bottom:20px;left:24px;color:#9fb4ce;font-size:12px}
#help{position:fixed;z-index:2;bottom:20px;right:24px;color:#9fb4ce;font-size:12px;text-align:right}
#panel{position:fixed;z-index:3;top:20px;right:20px;width:250px;padding:16px;background:rgba(8,19,34,.94);border:1px solid #29415e;border-radius:12px;box-shadow:0 8px 30px #0006;backdrop-filter:blur(10px)}
#panel h2{font-size:14px;margin:0 0 14px;letter-spacing:.08em;text-transform:uppercase}
.control{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0;color:#c8d8eb;font-size:13px}
.control input[type=range]{width:110px;accent-color:#45a5ff}
.control input[type=checkbox]{accent-color:#45a5ff;width:16px;height:16px}
.control select{background:#14263c;color:#eaf3ff;border:1px solid #38516d;border-radius:6px;padding:5px}
#panel button{width:100%;margin-top:8px;padding:9px;background:#173b60;color:#eaf3ff;border:1px solid #37658f;border-radius:7px;cursor:pointer}
#panel button:hover{background:#20517f}
#brightnessValue{font-variant-numeric:tabular-nums;color:#8fcaff;min-width:28px;text-align:right}
#modelInfo{font-size:11px;line-height:1.55;color:#9fb4ce;margin-top:12px;border-top:1px solid #29415e;padding-top:10px}
#panel select{max-width:125px}
#zoomButtons{display:flex;gap:7px}#zoomButtons button{width:50%}
@media(max-width:650px){header{top:12px;left:14px}h1{font-size:17px}#panel{top:76px;right:10px;width:210px;padding:12px}#help{display:none}#status{left:14px;bottom:12px}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="view"></div>
<header><h1>ARCWAVE · DESERT EAGLE</h1><p>3D asset preview · drag to rotate · scroll to zoom</p></header>
<div id="status">Loading model…</div><div id="help">Left drag: rotate<br>Scroll: zoom<br>Right drag: pan</div>
<aside id="panel">
  <h2>Preview settings</h2>
  <label class="control"><span>Brightness</span><span style="display:flex;align-items:center;gap:6px"><input id="brightness" type="range" min="0.5" max="3" step="0.1" value="1.2"><span id="brightnessValue">1.2×</span></span></label>
  <label class="control"><span>Reflections</span><input id="reflectionStrength" type="range" min="0" max="2.5" step="0.05" value="1.2"></label>
  <label class="control"><span>Metalness</span><input id="metalness" type="range" min="0" max="1" step="0.01" value="0.85"></label>
  <label class="control"><span>Roughness</span><input id="roughness" type="range" min="0.05" max="1" step="0.01" value="0.32"></label>
  <label class="control"><span>Show textures</span><input id="textures" type="checkbox" checked></label>
  <label class="control"><span>Scrolling shader</span><input id="scrollEnabled" type="checkbox" checked></label>
  <label class="control"><span>Scroll speed</span><input id="scrollSpeed" type="range" min="0" max="3" step="0.1" value="0.8"></label>
  <label class="control"><span>Scroll visibility</span><input id="scrollVisibility" type="range" min="0" max="1" step="0.05" value="1"></label>
  <label class="control"><span>Scroll scale</span><input id="scrollScale" type="range" min="1" max="30" step="1" value="4"></label>
  <label class="control"><span>Wireframe</span><input id="wireframe" type="checkbox"></label>
  <label class="control"><span>Show grid</span><input id="showGrid" type="checkbox" checked></label>
  <label class="control"><span>Auto-rotate</span><input id="autoRotate" type="checkbox"></label>
  <label class="control"><span>Background</span><select id="background"><option value="07111f">Navy</option><option value="000000">Black</option><option value="30343b">Grey</option><option value="d9e1ea">Light</option></select></label>
  <label class="control"><span>Lighting</span><select id="lighting"><option value="studio">Studio</option><option value="bright">Bright</option><option value="soft">Soft</option><option value="dramatic">Dramatic</option></select></label>
  <label class="control"><span>Texture inspection</span><select id="textureView"><option value="material">Normal material</option><option value="color">Colour map</option><option value="normal">Normal map</option><option value="specular">Specular map</option></select></label>
  <div class="control"><span>Zoom</span><span id="zoomButtons"><button id="zoomIn" type="button">+</button><button id="zoomOut" type="button">−</button></span></div>
  <button id="resetView" type="button">Reset camera view</button>
  <button id="screenshot" type="button">Save screenshot</button>
  <button id="fullscreen" type="button">Fullscreen</button>
  <div id="modelInfo">Model information<br>Waiting for model…</div>
</aside>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { DDSLoader } from 'three/addons/loaders/DDSLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const host=document.getElementById('view'), status=document.getElementById('status');
const brightnessInput=document.getElementById('brightness');
const brightnessValue=document.getElementById('brightnessValue');
const reflectionStrengthInput=document.getElementById('reflectionStrength');
const metalnessInput=document.getElementById('metalness');
const roughnessInput=document.getElementById('roughness');
const lightingSelect=document.getElementById('lighting');
const textureViewSelect=document.getElementById('textureView');
const modelInfo=document.getElementById('modelInfo');
const textureToggle=document.getElementById('textures');
const wireframeToggle=document.getElementById('wireframe');
const gridToggle=document.getElementById('showGrid');
const rotateToggle=document.getElementById('autoRotate');
const backgroundSelect=document.getElementById('background');
let modelRoot=null, modelMaterials=[], defaultCameraPosition=null, scrollShaders=[], loadedTextures={color:null,normal:null,specular:null,scroll:null};
const scrollEnabledInput=document.getElementById('scrollEnabled');
const scrollSpeedInput=document.getElementById('scrollSpeed');
const scrollScaleInput=document.getElementById('scrollScale');
const scrollVisibilityInput=document.getElementById('scrollVisibility');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x07111f);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,1000);
camera.position.set(4,3,6);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping;
const pmremGenerator=new THREE.PMREMGenerator(renderer);
scene.environment=pmremGenerator.fromScene(new RoomEnvironment(),0.04).texture;
renderer.toneMappingExposure=1.15; host.appendChild(renderer.domElement);
const hemi=new THREE.HemisphereLight(0x9bcaff,0x182235,2);scene.add(hemi);
const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(4,7,5);scene.add(key);
const rim=new THREE.DirectionalLight(0x168cff,2.5);rim.position.set(-5,2,-4);scene.add(rim);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0x0b1728,metalness:.25,roughness:.7}));
floor.rotation.x=-Math.PI/2;floor.position.y=-1.2;scene.add(floor);
const grid=new THREE.GridHelper(30,30,0x18385a,0x10243b);grid.position.y=-1.19;scene.add(grid);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.06;
controls.target.set(0,0,0);

const dds=new DDSLoader();
const textureFiles=['deagle_arcwave_color.dds','deagle_arcwave_normal.dds','deagle_arcwave_specular.dds','desert_texscroll.dds'];
const loadTexture=(file)=>new Promise((resolve)=>{const url=file==='desert_texscroll.dds'?'https://raw.githubusercontent.com/Magical298/deagle/main/desert_texscroll.dds':'./'+file;dds.load(url,resolve,undefined,()=>resolve(null));});
const loader=new FBXLoader();
loader.load('./arcwave.fbx',async(model)=>{
  const [color,normal,specular,scroll]=await Promise.all(textureFiles.map(loadTexture));
  if(color){color.colorSpace=THREE.SRGBColorSpace;color.flipY=false;}
  if(normal)normal.flipY=false;if(specular)specular.flipY=false;
  if(scroll){scroll.flipY=false;scroll.wrapS=THREE.RepeatWrapping;scroll.wrapT=THREE.RepeatWrapping;scroll.colorSpace=THREE.SRGBColorSpace;}
  loadedTextures={color,normal,specular,scroll};
  let vertexCount=0,faceCount=0,meshCount=0;
  const modelBounds=new THREE.Box3().setFromObject(model);
  const modelDimensions=modelBounds.getSize(new THREE.Vector3());
  const maxModelDimension=Math.max(modelDimensions.x,modelDimensions.y,modelDimensions.z)||1;
  model.traverse(obj=>{
    if(!obj.isMesh)return;
    meshCount++;
    const geometry=obj.geometry;
    if(geometry.attributes.position)vertexCount+=geometry.attributes.position.count;
    faceCount+=geometry.index?geometry.index.count/3:(geometry.attributes.position?geometry.attributes.position.count/3:0);
    obj.castShadow=true;obj.receiveShadow=true;
    const old=obj.material;
    const mat=new THREE.MeshStandardMaterial({color:0xffffff,map:color||null,normalMap:null,
      metalness:Number(metalnessInput.value),roughness:Number(roughnessInput.value),envMapIntensity:Number(reflectionStrengthInput.value)});
    if(old && old.color && !color)mat.color.copy(old.color);
    mat.userData.originalMap=mat.map;mat.userData.originalNormal=null;mat.userData.originalRoughness=null;
    if(scroll){
      mat.onBeforeCompile=(shader)=>{
        shader.uniforms.arcScrollMap={value:scroll};
        shader.uniforms.arcScrollTime={value:0};
        shader.uniforms.arcScrollSpeed={value:Number(scrollSpeedInput.value)};
        shader.uniforms.arcScrollScale={value:Number(scrollScaleInput.value)};
        shader.uniforms.arcScrollModelSize={value:maxModelDimension};
        shader.uniforms.arcScrollEnabled={value:scrollEnabledInput.checked?1:0};
        shader.uniforms.arcScrollVisibility={value:Number(scrollVisibilityInput.value)};
        shader.vertexShader=shader.vertexShader.replace(
          '#include <common>',
          '#include <common>\nvarying vec3 vArcwaveWorldPosition;\nvarying vec3 vArcwaveWorldNormal;'
        ).replace(
          '#include <worldpos_vertex>',
          '#include <worldpos_vertex>\nvArcwaveWorldPosition = (modelMatrix * vec4(transformed, 1.0)).xyz;\nvArcwaveWorldNormal = normalize(mat3(modelMatrix) * objectNormal);'
        );
        shader.fragmentShader=shader.fragmentShader.replace(
          '#include <common>',
          '#include <common>\nuniform sampler2D arcScrollMap;\nuniform float arcScrollTime;\nuniform float arcScrollSpeed;\nuniform float arcScrollScale;\nuniform float arcScrollModelSize;\nuniform float arcScrollEnabled;\nuniform float arcScrollVisibility;\nvarying vec3 vArcwaveWorldPosition;\nvarying vec3 vArcwaveWorldNormal;'
        ).replace(
          '#include <map_fragment>',
          `#include <map_fragment>
          if (arcScrollEnabled > 0.5) {
            vec3 arcN = normalize(vArcwaveWorldNormal);
            vec3 arcBlend = pow(max(abs(arcN) - vec3(0.2), vec3(0.0)), vec3(1.8));
            arcBlend /= max(arcBlend.x + arcBlend.y + arcBlend.z, 0.0001);
            vec3 arcP = vArcwaveWorldPosition / max(arcScrollModelSize, 0.001) * arcScrollScale;
            arcP += vec3(arcScrollTime * arcScrollSpeed, arcScrollTime * arcScrollSpeed * 0.63, arcScrollTime * arcScrollSpeed * 0.37);
            vec4 arcScroll = texture2D(arcScrollMap, arcP.yz) * arcBlend.x;
            arcScroll += texture2D(arcScrollMap, arcP.xz) * arcBlend.y;
            arcScroll += texture2D(arcScrollMap, arcP.xy) * arcBlend.z;
            diffuseColor.rgb = mix(diffuseColor.rgb, arcScroll.rgb, arcScrollVisibility);
          }`
        );
        scrollShaders.push(shader);
      };
      mat.customProgramCacheKey=()=> 'arcwave-triplanar-scroll-v1';
    }
    obj.material=mat;
    modelMaterials.push(mat);
  });
  const box=new THREE.Box3().setFromObject(model), size=box.getSize(new THREE.Vector3()), center=box.getCenter(new THREE.Vector3());
  model.position.sub(center);scene.add(model);modelRoot=model;
  const maxDim=Math.max(size.x,size.y,size.z)||1;
  camera.position.set(maxDim*1.5,maxDim*.9,maxDim*1.8);camera.near=maxDim/100;camera.far=maxDim*100;camera.updateProjectionMatrix();
  defaultCameraPosition=camera.position.clone();
  controls.target.set(0,0,0);controls.update();
  modelInfo.innerHTML='Meshes: '+meshCount+'<br>Vertices: '+vertexCount.toLocaleString()+'<br>Triangles: '+Math.floor(faceCount).toLocaleString()+'<br>Size: '+size.x.toFixed(3)+' × '+size.y.toFixed(3)+' × '+size.z.toFixed(3)+' units';
  status.textContent='Model loaded · textures '+(color?'loaded':'not found')+' · scrolling map '+(scroll?'loaded':'not found');
},undefined,error=>{console.error(error);status.textContent='Could not load arcwave.fbx — check the file name and GitHub Pages deployment.';});
function applyBrightness(){
  const value=Number(brightnessInput.value);
  brightnessValue.textContent=value.toFixed(1)+'×';
  renderer.toneMappingExposure=1.15*value;
  hemi.intensity=2*value;key.intensity=3*value;rim.intensity=2.5*value;
}
brightnessInput.addEventListener('input',applyBrightness);
reflectionStrengthInput.addEventListener('input',()=>{for(const mat of modelMaterials)mat.envMapIntensity=Number(reflectionStrengthInput.value);});
metalnessInput.addEventListener('input',()=>{for(const mat of modelMaterials)mat.metalness=Number(metalnessInput.value);});
roughnessInput.addEventListener('input',()=>{for(const mat of modelMaterials)mat.roughness=Number(roughnessInput.value);});
function updateScrollSettings(){for(const shader of scrollShaders){shader.uniforms.arcScrollSpeed.value=Number(scrollSpeedInput.value);shader.uniforms.arcScrollScale.value=Number(scrollScaleInput.value);shader.uniforms.arcScrollEnabled.value=scrollEnabledInput.checked?1:0;shader.uniforms.arcScrollVisibility.value=Number(scrollVisibilityInput.value);}}
scrollEnabledInput.addEventListener('change',updateScrollSettings);
scrollSpeedInput.addEventListener('input',updateScrollSettings);
scrollScaleInput.addEventListener('input',updateScrollSettings);

wireframeToggle.addEventListener('change',()=>{for(const mat of modelMaterials)mat.wireframe=wireframeToggle.checked;});
gridToggle.addEventListener('change',()=>{grid.visible=gridToggle.checked;floor.visible=gridToggle.checked;});
rotateToggle.addEventListener('change',()=>{controls.autoRotate=rotateToggle.checked;});
backgroundSelect.addEventListener('change',()=>{const c=new THREE.Color('#'+backgroundSelect.value);scene.background=c;});
function applyTextureInspection(){
  const mode=textureViewSelect.value;
  for(const mat of modelMaterials){
    mat.map=textureToggle.checked?(mode==='material'?mat.userData.originalMap:(loadedTextures[mode]||null)):null;
    mat.normalMap=textureToggle.checked&&mode==='material'?mat.userData.originalNormal:null;
    mat.roughnessMap=textureToggle.checked&&mode==='material'?mat.userData.originalRoughness:null;
    mat.needsUpdate=true;
  }
}
textureViewSelect.addEventListener('change',()=>{textureToggle.checked=true;applyTextureInspection();});
textureToggle.addEventListener('change',()=>{
  if(!textureToggle.checked)textureViewSelect.value='material';
  applyTextureInspection();
});
lightingSelect.addEventListener('change',()=>{
  const presets={studio:[2,3,2.5,1.15],bright:[3.2,4.5,1.4,1.35],soft:[2.8,1.8,.7,1.05],dramatic:[.8,4.2,3.8,1.1]};
  const p=presets[lightingSelect.value],b=Number(brightnessInput.value);
  hemi.intensity=p[0]*b;key.intensity=p[1]*b;rim.intensity=p[2]*b;renderer.toneMappingExposure=p[3]*b;
});
document.getElementById('zoomIn').addEventListener('click',()=>camera.position.multiplyScalar(.8));
document.getElementById('zoomOut').addEventListener('click',()=>camera.position.multiplyScalar(1.25));
document.getElementById('screenshot').addEventListener('click',()=>{
  renderer.render(scene,camera);
  const link=document.createElement('a');link.download='arcwave-preview.png';link.href=renderer.domElement.toDataURL('image/png');link.click();
});
document.getElementById('fullscreen').addEventListener('click',()=>{
  if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();
});
document.getElementById('resetView').addEventListener('click',()=>{
  if(defaultCameraPosition)camera.position.copy(defaultCameraPosition);
  controls.target.set(0,0,0);controls.update();
});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const scrollClock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const elapsed=scrollClock.getElapsedTime();for(const shader of scrollShaders)shader.uniforms.arcScrollTime.value=elapsed;controls.update();renderer.render(scene,camera);}animate();
</script>
</body></html>
